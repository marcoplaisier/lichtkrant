# The same checks CI runs. Install once with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check src tests
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check src tests
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        types_or: [python, html, yaml]
