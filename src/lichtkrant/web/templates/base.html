<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lichtkrant{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff8855;
            margin-bottom: 10px;
        }
        h2 {
            color: #00ff88;
            font-size: 1.3em;
            margin-top: 30px;
        }
        nav {
            display: flex;
            gap: 0;
            margin-bottom: 25px;
            border-radius: 8px;
            overflow: hidden;
        }
        nav a {
            flex: 1;
            padding: 12px;
            background: #16213e;
            color: #aaa;
            text-decoration: none;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }
        nav a:hover { background: #1a2a4e; color: #ccc; }
        nav a.active {
            background: #00ff88;
            color: #1a1a2e;
        }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #aaa;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #16213e;
            color: #fff;
            font-size: 16px;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #00ff88;
        }
        input[type="range"] { width: 100%; }
        input[type="number"] {
            padding: 8px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #16213e;
            color: #fff;
            font-size: 14px;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #00ff88;
        }
        button, .btn {
            padding: 15px;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:hover, .btn:hover { transform: scale(1.02); }
        button:active, .btn:active { transform: scale(0.98); }
        .btn-full { width: 100%; }
        .btn-small { padding: 8px 12px; font-size: 12px; }
        .btn-danger { background: linear-gradient(135deg, #ff6666, #cc4444); }
        .btn-secondary { background: linear-gradient(135deg, #666, #444); color: #fff; }
        .btn-info { background: linear-gradient(135deg, #4488ff, #3366cc); color: #fff; }
        .status {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
        }
        .status.success { background: #00ff8833; color: #00ff88; }
        .status.error { background: #ff006633; color: #ff6666; }
        .speed-presets { display: flex; gap: 6px; flex-wrap: wrap; }
        .speed-preset {
            flex: 1;
            min-width: 90px;
            padding: 12px 6px;
            background: #16213e;
            border: 2px solid #333;
            color: #aaa;
            font-size: 14px;
        }
        .speed-preset.selected {
            background: #00ff88;
            border-color: #00ff88;
            color: #1a1a2e;
        }
        .speed-advanced-toggle {
            margin-top: 8px;
            padding: 4px 0;
            background: none;
            color: #9ca3af;
            font-size: 13px;
            font-weight: normal;
            text-decoration: underline;
        }
        .speed-advanced { margin-top: 8px; }
        .speed-advanced input { width: 100px; }
        .speed-hint { color: #9ca3af; font-size: 13px; margin-left: 8px; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 4px;
        }
        .badge-color { background: #333; }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .checkbox-group input[type="checkbox"] { width: 20px; height: 20px; }
        .segment-color-indicator {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 11px;
            margin-right: 2px;
        }
        .badge-control {
            background: #2a1a4e;
            border: 1px solid #8855cc44;
            color: #cc88ff;
        }
        .card {
            background: #16213e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }
        {% block extra_style %}{% endblock %}
    </style>
</head>
<body>
    <h1>Lichtkrant</h1>
    <nav>
        <a href="/" {% if active_page == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
        <a href="/texts/" {% if active_page == 'texts' %}class="active"{% endif %}>Texts</a>
        <a href="/queue/" {% if active_page == 'queue' %}class="active"{% endif %}>Queue</a>
        <a href="/config/" {% if active_page == 'config' %}class="active"{% endif %}>Configuration</a>
    </nav>
    {% block content %}{% endblock %}
    <script>
        const COLOR_CSS = {
            NONE: '#000', GREEN: '#0f0', RED: '#f44', BLUE: '#48f',
            YELLOW: '#ff0', CYAN: '#0ff', MAGENTA: '#f0f', WHITE: '#fff'
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeAttr(text) {
            return text.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function showStatus(el, success, message) {
            el.style.display = 'block';
            el.className = 'status ' + (success ? 'success' : 'error');
            el.textContent = message;
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        // Scroll speed presets. The display takes a delay between scroll
        // steps (1 = fastest, 255 = slowest), so faster presets are lower.
        const SPEED_PRESETS = [
            { label: 'Very slow', value: 128 },
            { label: 'Slow', value: 64 },
            { label: 'Normal', value: 32 },
            { label: 'Fast', value: 16 },
            { label: 'Very fast', value: 8 },
        ];
        const DEFAULT_SPEED = 32;

        function speedLabel(value) {
            const preset = SPEED_PRESETS.find(p => p.value === value);
            return preset ? preset.label : `Custom (${value})`;
        }

        // Render a speed picker into `container`. The raw value lives in a
        // hidden input with id `inputId`. Returns { set(value) }.
        function initSpeedPicker(container, inputId) {
            container.innerHTML = `
                <input type="hidden" id="${inputId}" name="speed" value="${DEFAULT_SPEED}">
                <div class="speed-presets" role="group" aria-label="Scroll speed">
                    ${SPEED_PRESETS.map(p =>
                        `<button type="button" class="speed-preset" data-value="${p.value}">${p.label}</button>`
                    ).join('')}
                </div>
                <button type="button" class="speed-advanced-toggle">Advanced</button>
                <div class="speed-advanced" style="display: none;">
                    <input type="number" min="1" max="255" value="${DEFAULT_SPEED}" aria-label="Exact scroll delay">
                    <span class="speed-hint">Exact delay: 1 is fastest, 255 is slowest</span>
                </div>
            `;
            const hidden = container.querySelector('input[type="hidden"]');
            const buttons = container.querySelectorAll('.speed-preset');
            const advanced = container.querySelector('.speed-advanced');
            const exact = advanced.querySelector('input');

            function highlight(value) {
                buttons.forEach(b => {
                    const selected = parseInt(b.dataset.value) === value;
                    b.classList.toggle('selected', selected);
                    b.setAttribute('aria-pressed', selected);
                });
            }

            function set(value) {
                hidden.value = value;
                exact.value = value;
                highlight(value);
                // Show the exact value when it matches no preset
                const isPreset = SPEED_PRESETS.some(p => p.value === value);
                if (!isPreset) advanced.style.display = 'block';
            }

            buttons.forEach(b => b.addEventListener('click', () => set(parseInt(b.dataset.value))));
            container.querySelector('.speed-advanced-toggle').addEventListener('click', () => {
                advanced.style.display = advanced.style.display === 'none' ? 'block' : 'none';
            });
            exact.addEventListener('input', () => {
                const value = parseInt(exact.value);
                if (value >= 1 && value <= 255) {
                    hidden.value = value;
                    highlight(value);
                }
            });

            set(DEFAULT_SPEED);
            return { set };
        }

        function renderSegmentBadges(segments) {
            if (!segments || segments.length === 0) return '';
            return segments.map(s => {
                const type = s.type || 'text';
                if (type === 'pause')
                    return `<span class="segment-color-indicator badge-control">[Pause ${s.duration}s]</span>`;
                if (type === 'fast_blink')
                    return `<span class="segment-color-indicator badge-control">[Fast Blink x${s.times}]</span>`;
                if (type === 'slow_blink')
                    return `<span class="segment-color-indicator badge-control">[Slow Blink x${s.times}]</span>`;
                if (type === 'flash')
                    return `<span class="segment-color-indicator badge-control">[Flash "${escapeHtml(s.text)}" ${s.duration}s${s.scroll_off ? ' scroll' : ''}]</span>`;
                return `<span class="segment-color-indicator" style="color: ${COLOR_CSS[s.color] || '#fff'}; border: 1px solid ${COLOR_CSS[s.color] || '#fff'}44">${escapeHtml(s.text)} <small>(${s.color})</small></span>`;
            }).join('');
        }
        {% block extra_script %}{% endblock %}
    </script>
</body>
</html>
